<h1>{{ product.name }}</h1>
<p>Category: <a href="{% url 'catalog:category-products' product.category.slug %}">{{ product.category.name }}</a></p>
<p>Price: ₹{{ product.price }}</p>
<p>{% if product.stock > 0 %}In stock: {{ product.stock }}{% else %}Out of stock{% endif %}</p>
<a href="{% url 'catalog:product-list' %}">← Back to products</a>
